# Render Blueprint: New + -> Blueprint -> pick this repo. Free web service, built from the Dockerfile.
services:
  - type: web
    name: tejas-photography-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL          # paste the Neon connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: CORS_ORIGINS          # e.g. https://tejas-photography.vercel.app,https://*.vercel.app
        sync: false
      - key: WHATSAPP_ENABLED
        value: "false"
