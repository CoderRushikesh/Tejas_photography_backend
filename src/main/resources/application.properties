# ---------- Local MySQL (testing only) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/tejas_photography?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.jwt.secret=dev-only-secret-change-me-please-0123456789abcdef
app.jwt.expiration-ms=86400000

# Let Hibernate create/update the tables from the entities.
# Flyway is off because your migration files are likely written for PostgreSQL.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Frontend (React dev server)
app.cors.allowed-origins=http://localhost:3000

# WhatsApp: off, so nothing is sent
app.whatsapp.enabled=false

server.port=8081

