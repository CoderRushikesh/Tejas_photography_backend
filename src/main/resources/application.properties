spring.application.name=tejas-photography-backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful

# ---------- Database (Neon) ----------
# DATABASE_URL (the Neon string) is read by DataSourceConfig and overrides these three.
# They are only a harmless fallback for a local Postgres.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tejas_photography}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- App ----------
app.timezone=Asia/Kolkata
app.default-country-code=91

# REQUIRED - no defaults, startup fails if missing
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

app.admin.name=${ADMIN_NAME:Tejas}
app.admin.phone=${ADMIN_PHONE:+91878861412}
app.cors.allowed-origins=${CORS_ORIGINS}

app.booking.max-confirmed-per-day=${MAX_CONFIRMED_PER_DAY:1}
app.studio.name=${STUDIO_NAME:Tejas Photography}
app.studio.contact-phone=${STUDIO_PHONE:+91878861412}

# ---------- WhatsApp Cloud API ----------
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.api-base-url=https://graph.facebook.com/v21.0
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.mode=${WHATSAPP_MODE:template}
app.whatsapp.language-code=${WHATSAPP_LANGUAGE:en}
app.whatsapp.confirmed-template=${WHATSAPP_CONFIRMED_TEMPLATE:booking_confirmed}

# ---------- API docs: off in production unless SWAGGER_ENABLED=true ----------
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html