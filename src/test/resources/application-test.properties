# Tests run on in-memory H2; Hibernate builds the schema (Flyway's SQL is PostgreSQL-only).
spring.datasource.url=jdbc:h2:mem:tejas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

