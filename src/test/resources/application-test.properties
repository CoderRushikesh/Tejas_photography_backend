app.admin.name=Test Admin
app.admin.email=admin@test.com
app.admin.phone=+919000000000
app.admin.password=Admin@12345
app.whatsapp.enabled=false
app.booking.max-confirmed-per-day=1
app.cors.allowed-origins=http://localhost:3000,https://*.vercel.app
